<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Forms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="tabs">
        <button type="button" class="tab-btn active" id="btn-signup">Signup</button>
        <button type="button" class="tab-btn" id="btn-login">Login</button>
    </div>

    <form id="signup-form" class="form-content active" novalidate>
        <h2>Create an account</h2>

        <div class="row">
            <div class="form-group">
                <label for="firstName">First name</label>
                <input type="text" id="firstName" placeholder="Enter first name">
                <div class="feedback"></div>
            </div>
            <div class="form-group">
                <label for="lastName">Last name</label>
                <input type="text" id="lastName" placeholder="Enter last name">
                <div class="feedback"></div>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Enter email">
            <div class="feedback"></div>
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="+380...">
            <div class="feedback"></div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="regPassword">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="Enter password">
                    <span class="toggle-password" onclick="togglePassword('regPassword')">👁️</span>
                </div>
                <div class="feedback"></div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm password">
                    <span class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</span>
                </div>
                <div class="feedback"></div>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="dob">Date Birth</label>
                <input type="date" id="dob">
                <div class="feedback"></div>
            </div>
            <div class="form-group">
                <label>Sex</label>
                <div class="radio-group">
                    <label><input type="radio" name="sex" value="male"> Male</label>
                    <label><input type="radio" name="sex" value="female"> Female</label>
                </div>
                <div class="feedback" id="sex-feedback"></div>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="country">Country</label>
                <select id="country">
                    <option value="">Choose...</option>
                    <option value="ukraine">Ukraine</option>
                    <option value="usa">USA</option>
                    <option value="poland">Poland</option>
                </select>
                <div class="feedback"></div>
            </div>
            <div class="form-group">
                <label for="city">City</label>
                <select id="city" disabled>
                    <option value="">Choose country first...</option>
                </select>
                <div class="feedback"></div>
            </div>
        </div>

        <div class="form-message" id="signup-success"></div>
        <button type="submit" class="submit-btn">Signup</button>
    </form>

    <form id="login-form" class="form-content" novalidate>
        <h2>Login here</h2>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username">
            <div class="feedback"></div>
        </div>

        <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="password-wrapper">
                <input type="password" id="loginPassword" placeholder="Enter password">
                <span class="toggle-password" onclick="togglePassword('loginPassword')">👁️</span>
            </div>
            <div class="feedback"></div>
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Remember Me</label>
        </div>

        <div class="form-message" id="login-success"></div>
        <button type="submit" class="submit-btn">Login</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
